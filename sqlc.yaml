version: "2"
sql:
  - engine: "postgresql"
    queries: "/db/queries/query.sql"
    schema: "/db/migrations/000001_initial.up.sql"
    gen:
      go:
        package: "db"
        out: "db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "JSONB"
            go_type: "json.RawMessage" # Or use map[string]interface{} if you need to manipulate it
